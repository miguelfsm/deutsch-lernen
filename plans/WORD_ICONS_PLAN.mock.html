    --red: #dc2626; --blue: #2563eb; --green: #16a34a; --new: #b45309; --new-bg: #fffbeb; --new-line: #f59e0b; --mockbar: #292524; --mockbar-ink: #f5f5f4;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --serif: 'Georgia', 'Times New Roman', serif; --sans: 'Arial', 'Helvetica', sans-serif;
  }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--serif); }
  * { box-sizing: border-box; } button { font: inherit; cursor: pointer; } img.ic { display: block; flex: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .mockbar { background: var(--mockbar); color: var(--mockbar-ink); padding: 10px 16px; font-family: var(--sans); font-size: 12px; }
  .mockbar-row { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .mockbar b { letter-spacing: 1.5px; text-transform: uppercase; font-size: 10.5px; color: #d6d3d1; margin-right: 6px; }
  .mockbar button { background: #44403c; color: var(--mockbar-ink); border: 0; border-radius: 99px; padding: 5px 11px; font-size: 12px; }
  .mockbar button[aria-pressed="true"] { background: var(--new-line); color: #1c1917; font-weight: 700; }
  .mockbar label { display: flex; gap: 6px; align-items: center; cursor: pointer; margin-left: 8px; }
  .stand { background: #fef3c7; color: #78350f; font-family: var(--sans); font-size: 12px; padding: 7px 16px; text-align: center; border-bottom: 1px solid #fcd34d; }
  nav.app { background: var(--raise); border-bottom: 1px solid var(--border); padding: 10px 16px; }
  .nav-inner { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .brand { font-weight: 700; font-size: 16px; background: none; border: 0; color: var(--ink); padding: 0; }
  .links { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; }
  .links span { font-family: var(--sans); font-size: 12.5px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--border); background: var(--white); color: var(--muted); white-space: nowrap; }
  .links span.on { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } .col { max-width: 560px; margin: 0 auto; width: 100%; } }
  body.hide-notes .notes { display: none; } body.hide-notes .wrap { grid-template-columns: minmax(0, 560px); justify-content: center; }
  .eyebrow { font-size: 11px; letter-spacing: 4px; color: var(--faint); text-transform: uppercase; margin-bottom: 6px; text-align: center; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; text-align: center; } .sub { font-family: var(--sans); font-size: 13.5px; color: var(--muted); margin: 8px 0 20px; text-align: center; }
  h2 { font-size: 12px; font-family: var(--sans); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
  .new { outline: 1.5px dashed var(--new-line); outline-offset: 3px; }
  .neu { font-family: var(--sans); font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: var(--new); background: var(--new-bg); border: 1px solid var(--new-line); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .pill { font-family: var(--sans); font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 2px solid transparent; background: #f5f5f4; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .pill.der { background: #dbeafe; } .pill.die { background: #ffe4e6; } .pill.das { background: #dcfce7; } .pill.on { border-color: var(--ink); font-weight: 700; }
  .seg { display: flex; padding: 4px; gap: 4px; background: #f5f5f4; border-radius: 12px; margin: 0 0 14px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px 6px; font-family: var(--sans); font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .head { padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--raise); display: flex; gap: 16px; align-items: center; }
  .big { font-size: 30px; font-weight: 700; letter-spacing: -1px; line-height: 1.05; } .gloss { font-size: 14px; color: var(--muted); margin-top: 5px; font-style: italic; }
  .art-der { color: var(--blue); } .art-die { color: var(--red); } .art-das { color: var(--green); }
  .row { padding: 12px 22px; border-top: 1px solid var(--line); font-family: var(--sans); font-size: 13.5px; color: var(--muted); line-height: 1.55; } .row:first-child { border-top: 0; }
  .row b { color: var(--ink); }
  table { width: 100%; border-collapse: collapse; } td { padding: 9px 22px; border-top: 1px solid var(--line); } td.p { color: var(--faint); font-style: italic; font-family: var(--sans); font-size: 14px; width: 34%; } td.f { font-size: 19px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 12px 6px 10px; min-height: 108px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.04); text-align: center; font-size: 15px; }
  .tile small { display: block; font-family: var(--sans); font-size: 11px; color: var(--faint); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { font-family: var(--sans); font-size: 13px; padding: 5px 11px 5px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--white); display: inline-flex; align-items: center; gap: 6px; }
  .chip.t { padding-left: 11px; }
  .lband { color: var(--white); padding: 16px 22px; display: flex; gap: 14px; align-items: center; background: #d0453f; } .lnum { font-size: 40px; font-weight: 700; font-family: var(--sans); line-height: 1; } .ltitle { font-size: 20px; font-weight: 700; }
  .btn { font-family: var(--sans); font-size: 13.5px; font-weight: 700; padding: 10px 16px; border-radius: 12px; border: 0; background: var(--ink); color: var(--white); } .btn.ghost { background: var(--white); color: var(--ink); border: 1px solid var(--border); }
  .btn.ok { background: var(--ok); } .btn.no { background: var(--bad); }
  .play { padding: 26px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 240px; justify-content: center; }
  .play .w { font-size: 30px; font-weight: 700; letter-spacing: -.5px; } .rule { height: 1px; background: var(--line); width: 100%; }
  input.txt { font-family: var(--serif); font-size: 20px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--border); width: 100%; max-width: 300px; text-align: center; }
  .fb { font-family: var(--sans); font-size: 14px; padding: 10px 14px; border-radius: 12px; } .fb.ok { background: var(--ok-bg); color: var(--ok); } .fb.no { background: var(--bad-bg); color: var(--bad); }
  .dd { background: var(--white); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.1); overflow: hidden; }
  .dd-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-family: var(--sans); font-size: 14px; border-top: 1px solid var(--line); } .dd-row:first-child { border-top: 0; } .dd-row small { color: var(--faint); font-style: italic; margin-left: auto; }
  .lic { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; background: #1c1917; color: #e7e5e4; padding: 12px 14px; border-radius: 12px; max-height: 170px; overflow: auto; white-space: pre-wrap; }
  .cmp { display: grid; grid-template-columns: 90px repeat(8, 1fr); gap: 4px; align-items: center; font-family: var(--sans); font-size: 11px; } .cmp .r { color: var(--muted); } .cmp .c { display: flex; justify-content: center; padding: 4px 0; } .cmp .gap { color: var(--faint); text-align: center; }
  .notes { position: sticky; top: 16px; font-family: var(--sans); font-size: 13.5px; line-height: 1.55; color: #44403c; }
  .note { background: var(--new-bg); border: 1px solid #fcd34d; border-radius: 12px; padding: 14px 16px; } .note h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--new); }
  .note p { margin: 0 0 8px; } .note ul { margin: 0 0 8px; padding-left: 18px; } .note .steer { border-top: 1px dashed #fcd34d; padding-top: 8px; margin-top: 8px; } .note .steer b { color: var(--new); }
  .legend { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; } .legend i { display: inline-block; width: 22px; height: 14px; border: 1.5px dashed var(--new-line); border-radius: 4px; }
  .muted { color: var(--muted); font-family: var(--sans); font-size: 13px; }
</style>

    `<div style="display:grid;gap:14px">${one({ de: 'Hund', a: 'der', en: 'dog', pl: 'Hunde', i: ['dog'], ex: 'Der Hund schläft.' })}${one({ de: 'Tante', a: 'die', en: 'aunt', pl: 'Tanten', i: null, ex: 'Meine Tante wohnt in Bern.' })}</div>`;
}

function credits() {
  const c = CREDITS[state.credit];
  return head('Info', 'Bildnachweis', 'Wird aus src/assets/word-icons/SOURCE.json erzeugt.') + `<div class="seg" style="flex-wrap:wrap">${Object.keys(CREDITS).map((k) => `<button data-credit="${k}" aria-pressed="${k === state.credit}">${CREDITS[k][0].split(' · ')[0]}</button>`).join('')}</div>
    <div class="card new"><div class="row"><b>${c[0]}</b><p style="margin:8px 0 0;color:var(--ink)">${c[1]}</p></div><div class="row"><div class="lic">${c[2]}</div></div>
    <div class="row">${['red-apple', 'dog', 'house', 'key', 'eye'].map((n) => ic(n, 32)).join(' ')}</div></div><p class="muted" style="margin-top:10px">Erreichbar über die Fusszeile jeder Seite („Bildnachweis“) und die Startseite.</p>`;
}
function style() {
  const W = [['Hund', 'dog', 'dog'], ['Apfel', 'red-apple', null], ['Haus', 'house', 'house'], ['Schlüssel', 'key', 'key'], ['Ohr', 'ear', 'ear'], ['Fahrrad', 'bicycle', 'bicycle'], ['Kleid', 'dress', 'dress'], ['Schwein', 'pig', null]];
  const row = (label, set, sz) => `<div class="r">${label}</div>` + W.map((w) => { const n = set === 'ph' ? w[2] : w[1]; const has = n && ICONS[set] && ICONS[set][n]; return `<div class="c ${has ? '' : 'gap'}">${has ? ic(n, sz, set) : '–'}</div>`; }).join('');
  return head('Stil', 'Stil-Vergleich', 'Gleiche Wörter, vier Sets. Unicode-Namen sind gleich, darum ist das Set später austauschbar.') + `<div class="card" style="padding:14px"><div class="cmp"><div></div>${W.map((w) => `<div class="c">${w[0]}</div>`).join('')}
    ${row('Fluent 48', 'fluent', 48)}${row('Noto 48', 'noto', 48)}${row('OpenMoji 48', 'openmoji', 48)}${row('Phosphor 48', 'ph', 48)}${row('Fluent 32', 'fluent', 32)}${row('Noto 32', 'noto', 32)}</div></div>
    <p class="muted" style="margin-top:10px">Phosphor (Linien) hat für Apfel und Schwein nichts. Fluent und Twemoji wiegen ca. 1,2 KB pro Bild, Noto ca. 3,6 KB.</p>`;
}
const NOTES = {
  noun: ['Nomen-Karte', '<p>Das Bild steht links neben Artikel und Wort (56 px). Die Wortpillen tragen ein 18-px-Bild. <b>Kopf, Arm, Finger, Gesicht</b> sind „lose Hinweise“ (nur ungefähr das Wort); schalte sie oben in der Leiste aus, um den Unterschied zu sehen.</p><p>Plan §7.</p>', '<b>Frage 2:</b> lose Bilder zeigen? Ich würde ja, nach deiner Durchsicht der Liste.'],
  grid: ['Bilder-Ansicht', '<p>Neu: ein Schalter <i>Liste · Bilder</i> auf der Nomen-Seite. Die Kacheln (48 px) machen aus einer Kategorie ein Bild-Wörterbuch. Antippen öffnet die normale Karte.</p><p>Nur diese eine Ansicht ist neu; alles andere ist die bestehende Seite mit einem Bild mehr.</p>', '<b>Steer?</b> Erst mit Phase 3 (Oberflächen), nicht im ersten PR.'],
  verb: ['Verben', '<p>Bild im Kartenkopf (48 px). Verben bekommen weniger starke Bilder (Tätigkeit statt Ding): schlafen, lesen, essen, kochen, gehen sind gut. <b>sein</b> hat keins.</p>', '<b>Steer?</b> Bei Verben nur Bilder, die eine Handlung zeigen. Abstrakte (können, müssen) bleiben leer.'],
  cards: ['Karten', '<p>Deutsch → English: <b>kein Bild vorn</b> (es würde die Antwort verraten), Bild erscheint beim Aufdecken. English → Deutsch: Bild vorn (hilft bei Mehrdeutigem), es bleibt beim Aufdecken stehen.</p>', '<b>Frage 3:</b> Bild nie auf der Vorderseite bei Deutsch → English. Einverstanden?'],
  bild: ['Bild → Wort', '<p>Optionaler Modus (Phase 5). Nur Wörter mit <b>starkem</b> Bild, das nur ein Wort meint. Antwort tippen; gross/klein zählt als richtig mit Hinweis, weil Gross- und Kleinschreibung im Deutschen Bedeutung trägt. Screenreader hört die englische Bedeutung, nie das deutsche Wort.</p>', '<b>Steer?</b> Mit Bewertung wie die anderen Modi (Kartenstapel), gleiche Sitzungslogik.'],
  lesson: ['Lektionsseite', '<p>Chips bekommen 20 px, nur wenn ein Bild existiert. Das Beispiel zeigt Lektion 10 (Körperteile): dort ist die Trefferquote hoch. Abstraktes (Krankheit, Befinden) bleibt ohne.</p>', '<b>Steer?</b> Keine Platzhalter für fehlende Bilder.'],
  search: ['Suche', '<p>24-px-Spalte links, in Listen leer gelassen, damit die Wörter fluchten. Es ist rein dekorativ; das Wort steht daneben.</p>', '<b>Steer?</b> Bilder in der Suche sind das Erste, was ich weglassen würde, falls es überladen wirkt.'],
  none: ['Kein Bild', '<p>Gleiche Karte, zwei Fälle. Ohne Bild wird nichts reserviert: die Karte sieht aus wie heute. Kein „Bild fehlt“, kein grauer Kasten.</p><p>Mehrdeutig (<i>Bank</i>, <i>Schloss</i>, <i>Kohl</i>) oder irreführend (<i>Aprikose</i> ≠ Pfirsich): bewusst leer (null in der Zuordnung).</p>', ''],
  credits: ['Bildnachweis', '<p>Die Seite entsteht aus der Metadatei der eingecheckten Bilder. Wechsle den Reiter, um zu sehen, was ein anderes Set verlangen würde: MIT und Apache verlangen den Lizenztext, CC BY einen Namensvermerk, CC BY-SA zusätzlich Share-Alike für bearbeitete Bilder.</p>', '<b>Frage 1:</b> Fluent Flat (MIT) empfohlen, Noto als Reserve.'],
  style: ['Stil-Vergleich', '<p>Echte Bilder derselben Wörter. Fluent: flach, ruhig, leicht. Noto: am detailliertesten, dreimal schwerer. OpenMoji: dunkle Kontur, sehr klar bei kleiner Grösse. Phosphor: Linien, konsistent, aber ohne Tiere und Essen.</p>', '<b>Frage 1:</b> Welcher Stil gefällt dir? Ein Wechsel später kostet nur einen Befehl.'],
};
const RENDER = { noun, grid, verb, cards, bild, lesson, search, none, credits, style };
function render() {
  const s = state.screen;
  document.getElementById('screen').innerHTML = RENDER[s]();
  const [h, b, st] = NOTES[s];
  document.getElementById('notes').innerHTML = `<div class="note"><h3>${h}</h3>${b}${st ? `<div class="steer">${st}</div>` : ''}</div><div class="legend"><i></i> gestrichelt = neu oder geändert</div>`;
  document.getElementById('mockbar').innerHTML = '<b>Mock · Bilder</b>' + SCREENS.map(([k, l]) => `<button data-go="${k}" aria-pressed="${k === s}">${l}</button>`).join('') +
    `<label><input type="checkbox" id="weakT" ${state.weak ? 'checked' : ''}> lose Bilder zeigen</label><label><input type="checkbox" id="notesT" ${document.body.classList.contains('hide-notes') ? '' : 'checked'}> Notizen</label>`;
  document.getElementById('links').innerHTML = NAVL.map((l) => `<span class="${NAVON[s] === l ? 'on' : ''}">${l}</span>`).join('');
  const bf = document.getElementById('bf');
  if (bf) bf.addEventListener('submit', (e) => { e.preventDefault(); state.bildRes = checkBild(BILD[state.bild % BILD.length], document.getElementById('bi').value); render(); });
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, input[type=checkbox]'); if (!b) return; const d = b.dataset;
  if (b.id === 'weakT') { state.weak = b.checked; return render(); }
  if (b.id === 'notesT') return document.body.classList.toggle('hide-notes', !b.checked);
  if (d.go) { state.screen = d.go; return render(); }
  if (d.sel) { state.sel = d.sel; if (state.screen === 'grid') state.screen = 'noun'; return render(); }
  if (d.verb) { state.verb = d.verb; return render(); }
  if (d.dir) { state.dir = d.dir; state.flip = false; return render(); }
  if ('flip' in d) { state.flip = true; return render(); }
  if ('next' in d) { state.card++; state.flip = false; return render(); }
  if ('bnext' in d) { state.bild++; state.bildRes = null; return render(); }
  if (d.credit) { state.credit = d.credit; return render(); }
});
render();
</script>
